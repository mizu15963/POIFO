
# 443番: LB なしのとき、CloudFront が https://origin.<domain> で届く
server {
    # Ubuntu 24.04 の nginx は 1.24 なので http2 は listen に書く（"http2 on;" は 1.25 から）
    listen 443 ssl http2 default_server;
    server_name __ORIGIN_HOST__;
    ssl_certificate     /etc/letsencrypt/live/__ORIGIN_HOST__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__ORIGIN_HOST__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    include snippets/poifo-app.conf;
}
