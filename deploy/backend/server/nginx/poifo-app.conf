# /etc/nginx/snippets/poifo-app.conf（setup-server.sh が置く）。80番と443番で共通のアプリ設定
root /var/www/poifo/current/public;   # デプロイで切り替わるリンク
index index.php;
charset utf-8;
client_max_body_size 10m;

# CloudFront（＝WAF）を通っていないリクエストは拒否する。
# 例外はヘルスチェック（/up、LB は秘密ヘッダーを付けない）と Let's Encrypt の確認だけ
set $poifo_deny 1;
if ($poifo_origin_ok) { set $poifo_deny 0; }
if ($poifo_unprotected_path) { set $poifo_deny 0; }
if ($poifo_deny) { return 403; }

location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }

location / { try_files $uri $uri/ /index.php?$query_string; }

location ~ \.php$ {
    try_files $fastcgi_script_name =404;
    include fastcgi_params;
    # $realpath_root にすると、current のリンクを切り替えた後に新しいリリースを読む
    fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
    fastcgi_param DOCUMENT_ROOT $realpath_root;
    fastcgi_pass unix:/run/php/php8.4-fpm.sock;
    fastcgi_read_timeout 30s;
}

location ~ /\.(?!well-known) { deny all; }
