; /etc/php/8.4/fpm/conf.d/99-poifo.ini と cli（setup-server.sh が置く）
expose_php = Off
memory_limit = 256M
upload_max_filesize = 10M
post_max_size = 10M
date.timezone = Asia/Tokyo
opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
; デプロイ時に PHP-FPM を reload するので、ファイルの更新確認はしない
opcache.validate_timestamps = 0
