# 依存バージョンの更新 PR を Dependabot に作らせる（月1回、まとめて1PR）
version: 2
updates:
  # ワークフローの uses: のアクション（更新 PR では actions.lock も更新されているか確認する）
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "deps"

  # バックエンドの PHP パッケージ（マージ前にアプリ CI が通ることを確認する）
  - package-ecosystem: "composer"
    directory: "/backend"
    schedule:
      interval: "monthly"
    groups:
      composer:
        patterns: ["*"]
    commit-message:
      prefix: "deps"

  # フロントの npm パッケージ
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "monthly"
    ignore:
      # @astrojs/check の peer が typescript ^5 || ^6 のため、対応版が出るまでメジャー更新はしない
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # CI・開発の Node（22）に型を合わせる。Node を上げるときに手で上げる
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      npm:
        patterns: ["*"]
    commit-message:
      prefix: "deps"

  # Terraform の provider。マージ前に「更新」ワークフローの plan で差分が出ないことを確認する
  - package-ecosystem: "terraform"
    directories:
      - "/terraform/*"
    schedule:
      interval: "monthly"
    groups:
      terraform:
        patterns: ["*"]
    commit-message:
      prefix: "deps"
